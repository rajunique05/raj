<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Card Project</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style34.css">
</head>
<body>

    <div class="pricing-card">
        <!-- Popular Tag -->
        <span class="badge">MOST POPULAR</span>
        
        <!-- Header Section -->
        <div class="card-header">
            <h2 class="plan-name">Pro Plan</h2>
            <p class="plan-description">Perfect for growing creators and small teams.</p>
        </div>

        <!-- Price Section -->
        <div class="price-container">
            <span class="currency">$</span>
            <span class="price">29</span>
            <span class="duration">/month</span>
        </div>

        <!-- Features List -->
        <ul class="features-list">
            <li><span class="check-icon">✓</span> Unlimited public projects</li>
            <li><span class="check-icon">✓</span> 50 GB storage space</li>
            <li><span class="check-icon">✓</span> Advanced analytics dashboard</li>
            <li><span class="check-icon">✓</span> 24/7 Priority email support</li>
        </ul>

        <!-- Action Button -->
        <button class="cta-btn">Choose Pro Plan</button>
    </div>

</body>
</html>
