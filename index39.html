  <!DOCTYPE html>
<html>
<head>
    <title>Color Changer</title>
</head>
<body>

    <h1>Color Changer</h1>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            document.body.style.backgroundColor = "red";
        }
    </script>

</body>
</html>
